projectsTitle: Proyectos
projectsIntro: Los proyectos pequeños y en evolución son parte de mi aprendizaje. Esto es lo que estoy construyendo ahora.
journeyTitle: Mi camino de aprendizaje
journey: Todavía no tengo experiencia profesional; soy estudiante y voy construyendo mis fundamentos proyecto a proyecto. Quiero que este portfolio muestre el proceso con honestidad: qué probé, qué aprendí y qué mejoraría después. A medida que avance, iré añadiendo proyectos y aprendizajes.
interestsTitle: Temas que me interesan
interests:
  - Tecnología centrada en las personas
  - Experiencias digitales bien pensadas
  - Cómo las ideas se convierten en productos útiles
  - Explorar nuevas herramientas y enfoques
contactTitle: Hablemos
contactIntro: Si algo de aquí te dio una idea, o quieres conversar sobre tecnología, aprendizaje o algún proyecto, me encantará saber de ti. Añade abajo los enlaces de contacto que quieras compartir.
