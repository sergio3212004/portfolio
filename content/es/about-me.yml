journeyTitle: Mi camino de aprendizaje
journey: >-
  Todavía no tengo experiencia profesional; soy estudiante y voy construyendo mis fundamentos proyecto a proyecto. Quiero que este portfolio muestre el proceso con honestidad: qué probé, qué aprendí y qué mejoraría después. A medida que avance, iré añadiendo proyectos y aprendizajes.
visionTitle: Mi visión
vision: >-
  Quiero contribuir a crear tecnología útil, reflexiva y accesible. Me interesa entender a las personas y los problemas detrás de un producto, no solo el código, y crear experiencias digitales que puedan mejorar un poco las cosas cotidianas.
interestsTitle: Temas que me interesan
interests:
