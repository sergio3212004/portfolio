personalNote: "Fuera del código, disfruto la música, la naturaleza y salir a hacer caminatas. Me gustan los animales y esos momentos al aire libre que invitan a observar con calma. Son intereses que me acompañan y me recuerdan que siempre hay algo por descubrir, tanto dentro como fuera de una pantalla."
