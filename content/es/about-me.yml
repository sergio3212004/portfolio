journeyTitle: Mi camino en la informática
journey: >-
  Soy estudiante de la carrera profesional de Ingeniería Informática en la Universidad Nacional de Trujillo y vivo en Trujillo, Perú. Desde niño me ha apasionado la computación: entender cómo funciona, explorar sus posibilidades y descubrir lo que podemos crear con ella. Mi formación universitaria es un paso importante para convertir esa curiosidad en conocimientos y proyectos.
visionTitle: Mi visión
vision: >-
  Desde niño he querido aportar al desarrollo de la ciencia. Hoy encuentro en la Ingeniería Informática una manera de acercarme a ese propósito: aprender a fondo, hacer preguntas y construir herramientas que ayuden a explorar ideas y resolver problemas. Quiero crecer como profesional sin perder la curiosidad que me llevó a interesarme por la computación.
