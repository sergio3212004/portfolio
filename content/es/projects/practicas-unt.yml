description: "Aplicación web para gestionar y monitorear las prácticas preprofesionales de la Escuela de Informática de la Universidad Nacional de Trujillo. Incluye registro de empresas con consulta de RUC y autocompletado de datos, además de ingreso manual cuando el servicio no está disponible. Desarrollado como proyecto universitario; actualmente no cuenta con un enlace público."
