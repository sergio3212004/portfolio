currentStatus: Estudiante de Ingeniería Informática
heroTitle: Desarrollador full stack
heroSubtitle: Aprendo construyendo experiencias digitales.
heroDescription: Estudio Ingeniería Informática en la Universidad Nacional de Trujillo. Desde niño me apasiona la computación y sueño con aportar al desarrollo de la ciencia. Hoy convierto esa curiosidad en aprendizaje y proyectos.
heroCta: Explora mis proyectos
careerTitle: Mi formación en Ingeniería Informática
careerDescription: >-
  Actualmente estudio la carrera profesional de Ingeniería Informática en la Universidad Nacional de Trujillo, en Perú. La universidad es una parte importante de mi camino: allí construyo las bases para comprender la computación y desarrollar soluciones a través del software.
careerDetail: >-
  Mi interés por la computación nació cuando era niño, junto con el deseo de contribuir al desarrollo de la ciencia. Quiero conectar mi formación universitaria con proyectos que me permitan explorar ideas, resolver problemas y poner lo aprendido al servicio de las personas.
quotesTitle: Ideas que me inspiran
quotesIntro: Algunas ideas de informáticos que conectan con la forma en que quiero aprender y crear.
quotes:
  - text: "Solo podemos ver un poco hacia adelante, pero podemos ver que hay mucho por hacer."
    author: Alan Turing
    source: Computing Machinery and Intelligence, 1950
    sourceUrl: https://doi.org/10.1093/mind/LIX.236.433
  - text: "En lugar de imaginar que nuestra tarea principal es indicar a una computadora qué hacer, concentrémonos más bien en explicar a los seres humanos qué queremos que haga una computadora."
    author: Donald Knuth
    source: Literate Programming, 1984
    sourceUrl: https://www.cs.tufts.edu/~nr/cs257/archive/literate-programming/01-knuth-lp.pdf
  - text: "El precio de la fiabilidad es la búsqueda de la máxima sencillez."
    author: Sir Antony Hoare
    source: Sir Antony Hoare, 1980
    sourceUrl: https://www.cs.utexas.edu/~EWD/transcriptions/EWD13xx/EWD1304.html
  - text: "La frase más peligrosa del lenguaje es: 'Siempre lo hemos hecho así'."
    author: Grace Hopper
    source: Computerworld, 1976
    sourceUrl: https://en.wikiquote.org/wiki/Grace_Hopper
  - text: "La mejor manera de predecir el futuro es inventarlo."
    author: Alan Kay
    source: Xerox PARC, 1971
    sourceUrl: https://en.wikiquote.org/wiki/Alan_Kay
faqTitle: Preguntas frecuentes
faqIntro: Un poco más sobre mi momento actual y lo que quiero conseguir.
faqs:
  - question: ¿Qué estás estudiando?
    answer: >-
      Estudio la carrera profesional de Ingeniería Informática en la Universidad Nacional de Trujillo, en Perú. Complemento mi formación universitaria con proyectos que me ayudan a llevar la programación y la resolución de problemas a la práctica.
  - question: ¿Tienes experiencia profesional?
    answer: >-
      Todavía no. Actualmente soy estudiante y mi portfolio se centra en proyectos personales y aprendizaje. Veo cada proyecto como una oportunidad para practicar, reflexionar y mejorar.
  - question: ¿Qué tecnologías estás aprendiendo?
    answer: >-
      Este portfolio forma parte de mi aprendizaje con Nuxt, Vue, TypeScript, Nuxt UI y Nuxt Content. Sigo explorando nuevas herramientas y ampliaré esta lista a medida que adquiera experiencia práctica.
  - question: ¿Puedo contactarte sobre un proyecto o una idea?
    answer: >-
      Sí. Siempre estoy abierto a conversaciones interesantes sobre tecnología, aprendizaje y proyectos. Visita mi página de Contacto para ver los canales que he decidido compartir.

