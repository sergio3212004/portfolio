projectsTitle: Projects
projectsIntro: Small and growing projects are part of how I learn. Here's what I'm currently working on.
journeyTitle: The learning journey
journey: I don't have professional experience yet; I'm a student building my foundations one project at a time. I want this portfolio to show the process honestly: what I tried, what I learned, and what I would improve next. As I grow, I'll keep adding projects and lessons here.
