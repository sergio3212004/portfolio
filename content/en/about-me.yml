journeyTitle: The learning journey
journey: >-
  I don't have professional experience yet; I'm a student building my foundations one project at a time. I want this portfolio to show the process honestly: what I tried, what I learned, and what I would improve next. As I grow, I'll keep adding projects and lessons here.
visionTitle: My vision
vision: >-
  I want to help create technology that feels useful, thoughtful, and accessible. I’m interested in understanding the people and problems behind a product—not just the code—and in making digital experiences that make everyday things a little better.
interestsTitle: Things that interest me
interests:
  - Human-centered technology
  - Thoughtful digital experiences
  - Learning how ideas become useful products
  - Exploring new tools and approaches
