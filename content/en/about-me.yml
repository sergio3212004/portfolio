journeyTitle: My journey in computing
journey: >-
  I am an Informatics Engineering student at Universidad Nacional de Trujillo, based in Trujillo, Peru. Since childhood, I have been passionate about computing: understanding how it works, exploring its possibilities, and discovering what we can create with it. My university education is an important step toward turning that curiosity into knowledge and projects.
visionTitle: My vision
vision: >-
  Since childhood, I have wanted to contribute to science. Today, Informatics Engineering gives me a way to work toward that goal: learning deeply, asking questions, and building tools that help explore ideas and solve problems. I want to grow as a professional while keeping the curiosity that first drew me to computing.
